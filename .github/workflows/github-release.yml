name: Publish GitHub release APKs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Release tooling regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validate release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the stable vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null; then
            echo "Checked-out history is missing origin/$DEFAULT_BRANCH." >&2
            exit 1
          fi
          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          checked_out_commit="$(git rev-parse HEAD)"
          if [[ "$checked_out_commit" != "$release_commit" ]]; then
            echo "Checkout $checked_out_commit does not match release tag commit $release_commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Release tag must point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          fi
          python3 scripts/verify_release_version.py \
            --tag "$GITHUB_REF_NAME" \
            --history-ref "origin/$DEFAULT_BRANCH"

      - name: Validate public signing certificate pin
        shell: bash
        run: |
          set -euo pipefail
          pin_file="config/release-signing-certificate.sha256"
          if [[ ! -f "$pin_file" ]] || ! grep -Eq '^[0-9a-fA-F]{64}$' "$pin_file"; then
            echo "A verified Android update-certificate SHA-256 pin must be committed." >&2
            exit 1
          fi

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room migration and SQL aggregation tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :data:pixel2Api34DebugAndroidTest
      - name: Real bundled TFLite runtime tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :ml:pixel2Api34DebugAndroidTest
      - name: App, Hilt, and navigation smoke tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :app:pixel2Api34DebugAndroidTest
      - name: Upload managed-device reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-managed-device-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/managed_device_android_test_additional_output/**

      - name: Prepare release signing
        env:
          ALARMCONTROL_KEYSTORE_BASE64: ${{ secrets.ALARMCONTROL_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ALARMCONTROL_KEYSTORE_BASE64" ]]; then
            echo "Required GitHub secret is missing: ALARMCONTROL_KEYSTORE_BASE64" >&2
            exit 1
          fi
          umask 077
          keystore_path="$RUNNER_TEMP/alarmcontrol-release.jks"
          printf '%s' "$ALARMCONTROL_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "Decoded release keystore is empty." >&2
            exit 1
          fi
          echo "ALARMCONTROL_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Build verified signed release candidate
        env:
          ALARMCONTROL_KEYSTORE_PASSWORD: ${{ secrets.ALARMCONTROL_KEYSTORE_PASSWORD }}
          ALARMCONTROL_KEY_ALIAS: ${{ secrets.ALARMCONTROL_KEY_ALIAS }}
          ALARMCONTROL_KEY_PASSWORD: ${{ secrets.ALARMCONTROL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ALARMCONTROL_KEYSTORE_PASSWORD \
            ALARMCONTROL_KEY_ALIAS \
            ALARMCONTROL_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub secret is missing: $name" >&2
              exit 1
            fi
          done
          ./gradlew \
            '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8' \
            --no-daemon \
            --dependency-verification strict \
            -Palarmcontrol.releaseAbiApks=true \
            :app:releaseCandidate

      - name: Confirm package identity and package APKs
        shell: bash
        run: |
          set -euo pipefail
          version_name="${GITHUB_REF_NAME#v}"
          release_dir="$RUNNER_TEMP/github-release"
          python3 scripts/package_release_apks.py \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --version "$version_name" \
            --output-dir "$release_dir"

          mapfile -t aapts < <(
            find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 \
              -type f -name aapt | sort -V
          )
          if (( ${#aapts[@]} == 0 )); then
            echo "Android aapt was not found." >&2
            exit 1
          fi
          aapt="${aapts[${#aapts[@]} - 1]}"

          shopt -s nullglob
          apks=("$release_dir"/*.apk)
          checksums=("$release_dir"/*.apk.sha256)
          if (( ${#apks[@]} != 5 || ${#checksums[@]} != 5 )); then
            echo "Expected five APKs and five checksums; found ${#apks[@]} and ${#checksums[@]}." >&2
            exit 1
          fi
          (
            cd "$release_dir"
            sha256sum --check ./*.apk.sha256
          )
          for apk in "${apks[@]}"; do
            package_line="$("$aapt" dump badging "$apk" | sed -n '1p')"
            package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
            packaged_version="$(sed -n "s/.* versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
            if [[ "$package_name" != "com.alarmcontrol" ]]; then
              echo "Unexpected APK package in $(basename "$apk"): $package_name" >&2
              exit 1
            fi
            if [[ "$packaged_version" != "$version_name" ]]; then
              echo "Tag version $version_name does not match $(basename "$apk") version $packaged_version." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $GITHUB_REF_NAME; refusing to replace assets." >&2
            exit 1
          fi
          release_dir="$RUNNER_TEMP/github-release"
          shopt -s nullglob
          assets=("$release_dir"/*.apk "$release_dir"/*.apk.sha256)
          if (( ${#assets[@]} != 10 )); then
            echo "Expected exactly ten verified release assets, found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --draft \
            --generate-notes \
            --notes $'### Which APK should I download?\n\n- **arm64-v8a:** most current Android phones and tablets\n- **armeabi-v7a:** older 32-bit ARM devices\n- **x86_64 / x86:** mainly emulators or Intel-based devices\n- **universal:** use this if you are unsure\n\nDownload the `.sha256` file with the same name as your APK. GitHub does not select an ABI automatically.' \
            --title "AlarmControl $GITHUB_REF_NAME" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Remove decoded signing keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/alarmcontrol-release.jks"
