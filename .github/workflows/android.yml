name: Android verification

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM, quality, offline, and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis, JVM and Robolectric tests, offline guard
        run: ./gradlew --dependency-verification strict test check
      - name: Debug/release APK, release AAB, and all instrumented-test APKs
        run: >-
          ./gradlew --dependency-verification strict
          :app:assembleDebug
          :app:assembleRelease
          :app:bundleRelease
          :app:assembleDebugAndroidTest
          :data:assembleDebugAndroidTest
          :ml:assembleDebugAndroidTest
          :baselineprofile:assembleNonMinifiedRelease
          :baselineprofile:assembleBenchmarkRelease
      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/logs/**

  managed-device:
    name: API 34 managed-device integration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room migration and SQL aggregation tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :data:pixel2Api34DebugAndroidTest
      - name: Real bundled TFLite runtime tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :ml:pixel2Api34DebugAndroidTest
      - name: App, Hilt, and navigation smoke tests
        run: ./gradlew --dependency-verification strict -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect :app:pixel2Api34DebugAndroidTest
      - name: Upload managed-device reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: managed-device-reports-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/managed_device_android_test_additional_output/**
